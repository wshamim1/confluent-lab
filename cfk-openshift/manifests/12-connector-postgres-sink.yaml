apiVersion: platform.confluent.io/v1beta1
kind: Connector
metadata:
  name: postgres-sink-pageviews
  namespace: confluent
spec:
  class: "io.confluent.connect.jdbc.JdbcSinkConnector"
  taskMax: 1
  connectClusterRef:
    name: connect-pg
  configs:
    topics: "pageviews"
    connection.url: "jdbc:postgresql://postgres.confluent.svc.cluster.local:5432/inventory"
    connection.user: "pguser"
    connection.password: "pgpass123"
    auto.create: "true"
    auto.evolve: "true"
    insert.mode: "insert"
    key.converter: "org.apache.kafka.connect.storage.StringConverter"
    value.converter: "io.confluent.connect.avro.AvroConverter"
    value.converter.schema.registry.url: "http://schemaregistry.confluent.svc.cluster.local:8081"
