apiVersion: platform.confluent.io/v1beta1
kind: Connector
metadata:
  name: s3-sink-pageviews
  namespace: confluent
spec:
  class: "io.confluent.connect.s3.S3SinkConnector"
  taskMax: 1
  connectClusterRef:
    name: connect-s3
  configs:
    topics: "pageviews"
    s3.bucket.name: "confluent-data"
    s3.region: "us-east-1"
    s3.part.size: "5242880"
    flush.size: "10"
    storage.class: "io.confluent.connect.s3.storage.S3Storage"
    format.class: "io.confluent.connect.s3.format.json.JsonFormat"
    schema.generator.class: "io.confluent.connect.storage.hive.schema.DefaultSchemaGenerator"
    partitioner.class: "io.confluent.connect.storage.partitioner.DefaultPartitioner"
    store.url: "http://minio.confluent.svc.cluster.local:9000"
    aws.access.key.id: "minioadmin"
    aws.secret.access.key: "minioadmin123"
    aws.custom.endpoint: "http://minio.confluent.svc.cluster.local:9000"
    s3.path.style.access: "true"
    schema.compatibility: "NONE"
    key.converter: "org.apache.kafka.connect.storage.StringConverter"
    value.converter: "io.confluent.connect.avro.AvroConverter"
    value.converter.schema.registry.url: "http://schemaregistry.confluent.svc.cluster.local:8081"
